[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-repo-health"
dynamic = ["version"]
description = "A set of checks of the health of repositories."
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
authors = [
    { name = "edX", email = "oscm@edx.org" },
]
keywords = ["Django", "edx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dockerfile",
    "github-py @ git+https://github.com/ShineyDev/github.py.git@8e3514010eb35a91e012f2935f48138b3c35cef6",
    "gspread",
    "pytest-asyncio",
    "pytest-repo-health",
    "pyyaml",
    "toml",
]

[project.urls]
Homepage = "https://github.com/openedx/edx-repo-health"

[project.scripts]
repo_health_dashboard = "repo_health_dashboard.repo_health_dashboard:main"
run_checks = "scripts.run_checks:main"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["repo_health*", "repo_health_dashboard*", "scripts*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"repo_health_dashboard" = ["*.yaml"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*"]

[tool.coverage.run]
branch = true
source_pkgs = ["repo_health"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
test-base = [
    "pytest-cov",
    "responses",
]
test = [{include-group = "test-base"}]
quality = [
    {include-group = "test"},
    "django",
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
]
doc = [
    {include-group = "test"},
    "build",
    "doc8",
    "readme-renderer",
    "sphinx",
    "sphinx-book-theme",
    "twine",
]
ci = ["tox", "tox-uv>=1"]
dev = [
    {include-group = "quality"},
    {include-group = "doc"},
    {include-group = "ci"},
    "diff-cover",
    "rich",
]

[tool.edx_lint]
uv_constraints = [
    "cachetools==5.5.2",
    "gspread<5.12.0",
    "pytest<8.1.0",
    "setuptools==70.3.0",
]

[tool.uv]
package = true
default-groups = []
#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
    "cachetools==5.5.2",
    "gspread<5.12.0",
    "pytest<8.1.0",
    "setuptools==70.3.0",
]
