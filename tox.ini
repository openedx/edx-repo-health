[tox]
requires = tox-uv>=1
envlist = py312, quality

[doc8]
max-line-length = 120

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pytest]
addopts = --cov repo_health --cov-report term-missing --cov-report xml
norecursedirs = .* docs
testpaths =
    tests
markers =
    edx_health: marks tests as edx health checks
    py_dependency_health: marks tests as Python dependency health checks

[pydocstyle]
ignore = D101,D200,D203,D212,D215,D404,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414
match-dir = (?!migrations)

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
commands =
    pytest {posargs}

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    pylint src/repo_health src/repo_health_dashboard tests
    isort --check src/repo_health src/repo_health_dashboard tests

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
allowlist_externals =
    make
    rm
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/modules.rst
    python -m build --wheel
    twine check dist/*
    make -C docs clean
    make -C docs html
